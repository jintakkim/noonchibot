spring:
    application:
        name: noonchibot

    datasource:
        url: jdbc:mysql://localhost:3306/noonchibot
        username: root
        password: mine407603
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: create
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
                format_sql: true
        show-sql: false

binance:
    network: ${BINANCE_NETWORK}
    api_key: ${BINANCE_API_KEY}
    secret_key: ${BINANCE_SECRET_KEY}
    spot:
        trading-pair-symbol-map:
            "BTC-USDT": "BTCUSDT"
            "ETH-USDT": "ETHUSDT"
            "SOL-USDT": "SOLUSDT"
            "USDC-USDT": "USDCUSDT"
    derivative:
        trading-pair-symbol-map:
            "BTC-USDT": "BTCUSDT"
            "ETH-USDT": "ETHUSDT"
            "SOL-USDT": "SOLUSDT"

hyperliquid:
    network: ${HYPERLIQUID_NETWORK}
    address: ${HYPERLIQUID_ADDRESS}
    secret: ${HYPERLIQUID_SECRET}
    derivative:
        trading-pair-symbol-map:
          "BTC-USDC": "BTC"
          "ETH-USDC": "ETH"
          "SOL-USDC": "SOL"
